name: TaapTaap
options:
  bundleIdPrefix: com.fortvna
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 2
packages:
  TaapTaapCore:
    path: .
targets:
  TaapTaap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TaapTaapiOS
        excludes:
          - "**/*.md"
    info:
      path: TaapTaapiOS/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Taap Taap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: TaapTaapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fortvna.taaptaap
        PRODUCT_NAME: TaapTaap
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  TaapTaapMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TaapTaapiOS
        excludes:
          - Resources/Info.plist
          - "**/*.md"
    dependencies:
      - package: TaapTaapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fortvna.taaptaap.mac
        PRODUCT_NAME: TaapTaap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taap Taap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        ENABLE_APP_SANDBOX: YES
  TaapTaapUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/TaapTaapUITests
    dependencies:
      - target: TaapTaap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TaapTaap:
    build:
      targets:
        TaapTaap: all
    test:
      targets:
        - TaapTaapUITests
  TaapTaapMac:
    build:
      targets:
        TaapTaapMac: all
